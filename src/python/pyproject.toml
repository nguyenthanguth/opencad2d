[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "opencad2d"
dynamic = ["version"]
description = "OpenCAD2D for Python: commands and scripts inside the OpenCAD2D app, driving it from outside, and its drawings without a window"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["pythonnet>=3.2.1,<4"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]

[project.urls]
Documentation = "https://github.com/nguyenthanguth/opencad2d"
Source = "https://github.com/nguyenthanguth/opencad2d"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["opencad2d", "GeometryHelper-stubs", "OpenCAD2D-stubs", "System-stubs"]
artifacts = ["opencad2d/lib/**", "GeometryHelper-stubs/**", "OpenCAD2D-stubs/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
